name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o CCTV-Hub-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: cctv_hub
        run: |
          flutter create --platforms=android --org com.cctvhub --project-name cctv_hub .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp cctv_hub/build/app/outputs/flutter-apk/app-release.apk CCTV-Hub.apk
          gh release create build-${{ github.run_number }} CCTV-Hub.apk --title "CCTV Hub #${{ github.run_number }}" --notes "APK otomatis"
